name: Android Release (AAB)

# Bewusst nur manuell auslösbar: ein Release-Build braucht den Signaturschlüssel
# und soll nicht bei jedem Push laufen.
on:
  workflow_dispatch:
    inputs:
      versionName:
        description: 'Versionsname, z. B. 1.0.0 (leer = aus build.gradle)'
        required: false
        type: string
      versionCode:
        description: 'Versionscode, ganze Zahl (leer = aus build.gradle)'
        required: false
        type: string

jobs:
  build:
    name: AAB bauen und signieren
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3

      - name: Abhaengigkeiten installieren
        run: npm ci

      - name: Qualitaetspruefungen
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run puzzles:verify

      - name: Versionsnummern setzen
        if: inputs.versionName != '' || inputs.versionCode != ''
        run: |
          if [ -n "${{ inputs.versionName }}" ]; then
            sed -i "s/versionName \".*\"/versionName \"${{ inputs.versionName }}\"/" android/app/build.gradle
          fi
          if [ -n "${{ inputs.versionCode }}" ]; then
            sed -i "s/versionCode .*/versionCode ${{ inputs.versionCode }}/" android/app/build.gradle
          fi
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Web-Build und Android-Sync
        env:
          # Ohne gesetzte Secrets bleiben die Test-IDs stehen — ein Release mit
          # Test-IDs verdient zwar nichts, ist aber besser als eines, das
          # versehentlich mit echten IDs im Testmodus laeuft.
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          VITE_ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
          VITE_ADMOB_REWARDED_ID: ${{ secrets.ADMOB_REWARDED_ID }}
          VITE_ADMOB_TESTING: 'false'
        run: npm run android:prepare

      - name: Signaturschluessel bereitstellen
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/release.keystore
          cat > android/keystore.properties <<EOF
          storeFile=../release.keystore
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: AAB bauen
        working-directory: android
        run: ./gradlew --no-daemon bundleRelease

      - name: Signatur pruefen
        run: |
          BUNDLE=android/app/build/outputs/bundle/release/app-release.aab
          ls -lh "$BUNDLE"
          # Zeigt, mit welchem Schluessel signiert wurde. Steht dort
          # "CN=Android Debug", wurde ohne Release-Schluessel gebaut und die
          # Play Console lehnt den Upload ab.
          keytool -printcert -jarfile "$BUNDLE" | head -20

      - name: Signaturdaten wieder entfernen
        if: always()
        run: rm -f android/release.keystore android/keystore.properties

      - uses: actions/upload-artifact@v4
        with:
          name: bridgelet-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
