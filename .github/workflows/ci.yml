name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, Typecheck, Tests, Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhaengigkeiten installieren
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Formatierung pruefen
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit-Tests
        run: npm test

      - name: Web-Build
        run: npm run build
